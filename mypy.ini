[mypy]
python_version = 3.12
mypy_path = src/python
files = src/python/chirouter, scripts, run-mininet
strict = True

# Mininet doesn't have type annotations, so its classes are seen as
# "Any" (and we need to subclass some of them)
disallow_subclassing_any = False

[mypy-mininet.*]
ignore_missing_imports = True
